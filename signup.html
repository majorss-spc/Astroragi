<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroRagi — Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="signup" class="page">
<canvas id="starfield"></canvas>
<div class="container card fade-in">
  <h2 class="brand small">Create your account</h2>
  <form id="signupForm" class="form">
    <label>Email</label>
    <input type="email" id="signupEmail" placeholder="you@example.com" required>
    <label>Password</label>
    <input type="password" id="signupPassword" placeholder="••••••••" required>
    <label>Confirm Password</label>
    <input type="password" id="signupConfirm" placeholder="••••••••" required>
    <button type="submit" class="btn glow full">Sign Up</button>
  </form>
  <div id="signupMessage" class="message"></div>
  <div class="alt-link">Already have an account? <a href="login.html">Login</a></div>
  <div class="logo corner">♌</div>
  </div>
<script src="script.js"></script>
</body>
</html>
