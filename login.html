<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroRagi — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login" class="page">
<canvas id="starfield"></canvas>
<div class="container card fade-in">
  <h2 class="brand small">Welcome back</h2>
  <form id="loginForm" class="form">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" required>
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" required>
    <button type="submit" class="btn glow full">Login</button>
  </form>
  <div id="loginMessage" class="message"></div>
  <div class="alt-link">New here? <a href="signup.html">Create an account</a></div>
  <div class="logo corner">♌</div>
  </div>
<script src="script.js"></script>
</body>
</html>
